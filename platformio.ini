; GuiaSense - dois firmwares no mesmo projeto PlatformIO.
;
;   pio run -e esp32cam -t upload    -> grava a câmera
;   pio run -e bengala  -t upload    -> grava a bengala
;
; No VS Code, escolha o ambiente na barra inferior do PlatformIO.

[platformio]
default_envs = esp32cam

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; O PlatformIO normalmente acha a porta sozinho. Se não achar, descomente:
; upload_port = /dev/ttyUSB0   ; Linux (no Windows: COM3, COM4...)
; monitor_port = /dev/ttyUSB0

[env:esp32cam]
board = esp32cam
upload_speed = 115200
build_src_filter = +<esp_cam.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = huge_app.csv
monitor_rts = 0
monitor_dtr = 0

[env:bengala]
board = esp32dev
build_src_filter = +<bengala.cpp>
monitor_rts = 0
monitor_dtr = 0

[env:cam_serial]
board = esp32cam
upload_speed = 115200
monitor_speed = 921600
build_src_filter = +<cam_serial.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = huge_app.csv
monitor_rts = 0
monitor_dtr = 0